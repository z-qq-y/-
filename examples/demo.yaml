paper_title: "Synthetic demonstration: conventional and recyclable epoxy systems"
abstract: >-
  This fictional record is bundled only to demonstrate the review workflow. The
  first system is a conventional DGEBA/DDM epoxy. The second uses a disulfide
  curing agent and is described as a recyclable dynamic network. It is not a
  real publication and must not be used as scientific evidence or training data.
